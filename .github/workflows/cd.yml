name: CD - Deploy AWS EC2

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Configurar servidor SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          printf '%s ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIB+Ab16zIpNVMBRlLjooz4GSpgEzUbw6+atpuLHk/Pk6\n' "$EC2_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Atualizar aplicação na EC2
        run: |
            ssh -o StrictHostKeyChecking=yes -o BatchMode=yes -i ~/.ssh/id_rsa ubuntu@${{ secrets.EC2_HOST }} 'bash -se' << 'EOF'
            cd /opt/cesusc-devops
            git fetch origin
            git switch main
            git pull --ff-only origin main
            npm ci
            pm2 restart all
            EOF
